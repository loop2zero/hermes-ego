[project]
name = "hermes-ego"
version = "0.1.0"
description = "Relay that lets a Hermes agent drive ego lite on a Mac, with no inbound port on the Mac"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "trafilatura>=2.0",
    "uvicorn>=0.32",
    "websockets>=13",
]

[tool.uv]
package = false
