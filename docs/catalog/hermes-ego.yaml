# Draft catalog entry for a future PR to NousResearch/hermes-agent
# (plugin-catalog/hermes-ego.yaml). Do not open that PR from this repo.
# Shawn opens it. The public GitHub repository is not created yet.
#
# Schema: plugin-catalog/README.md "Entry schema" and
# https://hermes-agent.nousresearch.com/docs/developer-guide/plugins/catalog-submission

name: hermes-ego
title: Hermes Ego
repo: https://github.com/loop2zero/hermes-ego
# Submitter: replace with the full 40-character commit SHA after the public
# push to https://github.com/loop2zero/hermes-ego. Branches, tags, and short
# SHAs are rejected. Do not submit this placeholder.
sha: FULL_40_CHAR_SHA_PLACEHOLDER
subdir: plugins/hermes-ego
version: "0.1.0"
description: >-
  Hermes Ego reads and saves pages in the user's ego(lite) browser through a
  loopback MCP relay (Streamable HTTP at http://127.0.0.1:8767/mcp). The Mac
  daemon and the relay are installed separately, the same split as local-mcp;
  this package does not start, embed, or update them. Agent Plugins v1
  (plugin.json + mcp.json + skills/). Disclosure: long-running relay on
  loopback; Mac daemon runs the ego CLI against the user's logged-in ego(lite)
  browser; ego_save_page_markdown writes markdown under a configured save root
  (for example an Obsidian vault) and downloads third-party page images, some
  of which can finish in a background pass; a remote Hermes host needs an SSH
  local forward to that loopback; the bearer is EGO_RELAY_TOKEN from the
  Hermes profile environment, not a committed secret. The server is marked
  untrusted. The relay does not set readOnlyHint, so Hermes asks before every
  tool on this server, including reads, and refuses them when nobody can
  answer. Tools are served by the relay at runtime.
maintainer: Shawn Yuan
tier: community
category: tools
docs_url: https://github.com/loop2zero/hermes-ego/tree/main/plugins/hermes-ego
# plugin.json has no requires_hermes field (catalog rule 14). This entry is
# the only floor. Live installer that will run validate: Hermes Agent v0.23.0
# (2026.9.24). Do not raise this above 0.23.0 until a newer Hermes is confirmed.
requires_hermes: ">=0.23.0"
readme: true
# The plugin process runs wherever Hermes runs (Linux or macOS). The daemon
# and ego(lite) need macOS. Empty would mean "all platforms".
platforms: [linux, macos]
known_issues:
  - "The Mac daemon and ego(lite) are installed separately and are not part of this package. The daemon needs macOS. A remote Hermes host reaches the relay through an SSH local forward to 127.0.0.1:8767. The relay stays on loopback."
  - "Page images may finish in a background pass after ego_save_page_markdown returns. images_pending counts what is left. There is no second MCP response for that pass."
  - "Relay tools do not set readOnlyHint. trust untrusted asks before every tool on this server, including ego_status and ego_get_page_text, and those calls fail closed in cron and other unattended runs."
  - "A hand-written mcp_servers.ego entry replaces this package's server, including trust, unless that entry sets trust: untrusted."
  - "sha above is a placeholder. Replace it with the full 40-character commit after the public push before opening the NousResearch/hermes-agent PR."
capabilities:
  # These are the relay's MCP tool names, not ctx.register_tool registrations.
  # aave-mcp leaves provides_tools empty because the tools come from the remote
  # server at runtime and hermes plugins validate compares provides_tools to
  # register(). If catalog CI warns that these are declared but not registered,
  # empty this list and keep the names in the description.
  provides_tools:
    - ego_status
    - ego_list_tabs
    - ego_navigate
    - ego_get_page_text
    - ego_save_page_markdown
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - EGO_RELAY_TOKEN
